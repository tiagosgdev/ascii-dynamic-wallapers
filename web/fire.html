<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ASCII Fireplace</title>
<style>
  html, body { margin: 0; height: 100%; background: #030303; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---- tunables -------------------------------------------------------------
const CFG = {
  fps: 30,
  cellW: 7,          // CSS px per character
  cellH: 10,
  fireWidth: .1155,  // one world unit, as a fraction of screen width
  floorY: .17,       // height of the hearth above the bottom of the screen
  strikes: 6,        // clicks needed, in quick succession, to light it
  grow: 55,          // seconds from first flame to full fire
  burn: 3600,        // seconds it burns once fully grown
  extend: 600,       // seconds a burst of clicks adds to that
  hold: .25,         // a press longer than this is a hold, not a click
  snuff: 4.5,        // seconds of holding to take a full fire down to nothing
  burnLow: .8,       // while burning, size wanders between this and 100%
  fade: 110,         // seconds to die back down
  stillSeed: 7,      // which fire the lock screen shows
  fireflies: 28,     // how many drift around the clearing
  flyDrift: .06,     // their calm top speed, in screen heights per second
  flyFlee: .55,      // how much faster a frightened one can go
  flyAvoid: .2,      // how close the cursor gets before they scatter, in screen heights
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = +v;

const RAMP = " .:;i!*%S#@";
const GLYPHS = RAMP + "'\u25CF\u2022";
const G = Object.fromEntries([...GLYPHS].map((c, i) => [c, i]));

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const hash = (x, y) => {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

// ---- the woodpile ------------------------------------------------------------
// World: x right, y up from the hearth floor, z toward the viewer.
const LOGS = [
  { a: [-1.02, .21, -.42], b: [ .98, .21, -.58], r: .21, s: 3 },   // long one at the back
  { a: [ -.22, .19,  .64], b: [1.08, .18,  .42], r: .185, s: 8 },  // front right
  { a: [-1.02, .17,  .22], b: [ -.24, .17, .78], r: .165, s: 6 },  // front left, end toward us
  { a: [-1.06, .22,  .04], b: [ .44, .88, -.08], r: .165, s: 1 },  // the big one leaning across
  { a: [ .56, .64, -.48], b: [ .30, .43,  .46], r: .13, s: 5 },    // short one, end toward us
];
const CAM_Y = 1.6, CAM_D = 5.5;
const MAX_TONGUES = 20;
const vec3s = f => LOGS.map(l => `vec3(${f(l).map(v => v.toFixed(3)).join(",")})`).join(",");

// ---- shaders --------------------------------------------------------------
const VERT = `#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.-1.,0,1); }`;

// Pass 1: one texel per character, ray traced. Output: RGB colour, A glyph
// density (0 = empty space, drawn with no character).
const SIM = `#version 300 es
precision highp float;
uniform vec2 uRes, uCellPx;
uniform float uScale, uFloor, uT, uLevel, uEmbers, uFlick, uFlash, uWind;
uniform vec4 uRoot[${MAX_TONGUES}];   // xyz where the flame leaves the wood, w height
uniform vec4 uTong[${MAX_TONGUES}];   // x half-width, yz lean, w phase
out vec4 o;

const int NL=${LOGS.length};
const vec3 LA[NL]=vec3[NL](${vec3s(l => l.a)});
const vec3 LB[NL]=vec3[NL](${vec3s(l => l.b)});
const float LR[NL]=float[NL](${LOGS.map(l => l.r.toFixed(3)).join(",")});
const float LS[NL]=float[NL](${LOGS.map(l => l.s.toFixed(1)).join(",")});

const vec3 BOXMIN=vec3(-1.55,-.05,-1.1), BOXMAX=vec3(1.55,3.4,1.15);
const float HMAX=2.7;

float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float vn(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);
}
const mat2 ROT=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){
  float a=.5, s=0.;
  for(int i=0;i<4;i++){ s+=a*vn(p); p=ROT*p+vec2(3.1,7.7); a*=.5; }
  return s/.9375;
}

vec3 fireRamp(float x){
  x=clamp(x,0.,1.)*5.;
  vec3 c0=vec3(.05,.005,.0), c1=vec3(.42,.05,.01), c2=vec3(.9,.24,.03),
       c3=vec3(1.,.55,.08), c4=vec3(1.,.82,.28), c5=vec3(1.,.97,.74);
  if(x<1.) return mix(c0,c1,x);
  if(x<2.) return mix(c1,c2,x-1.);
  if(x<3.) return mix(c2,c3,x-2.);
  if(x<4.) return mix(c3,c4,x-3.);
  return mix(c4,c5,x-4.);
}

float cyl(vec3 p, vec3 a, vec3 b, float r){
  vec3 ba=b-a, pa=p-a;
  float baba=dot(ba,ba), paba=dot(pa,ba);
  float x=length(pa*baba-ba*paba)-r*baba;
  float y=abs(paba-baba*.5)-baba*.5;
  float x2=x*x, y2=y*y*baba;
  float d=max(x,y)<0.?-min(x2,y2):(x>0.?x2:0.)+(y>0.?y2:0.);
  return sign(d)*sqrt(abs(d))/baba;
}
float woodDist(vec3 p, out int id){
  float best=1e9;
  for(int i=0;i<NL;i++){
    float d=cyl(p,LA[i],LB[i],LR[i]);
    if(d<best){ best=d; id=i; }
  }
  return best;
}
float woodDist(vec3 p){ int id; return woodDist(p,id); }
vec3 woodNormal(vec3 p){
  const vec2 e=vec2(.004,-.004);
  return normalize(e.xyy*woodDist(p+e.xyy)+e.yyx*woodDist(p+e.yyx)+e.yxy*woodDist(p+e.yxy)+e.xxx*woodDist(p+e.xxx));
}

// Each flame climbs from its root on the wood. Returns how much flame is at q.
float flameAt(vec3 q){
  float total=0.;
  for(int i=0;i<${MAX_TONGUES};i++){
    vec4 R=uRoot[i];
    if(R.w<.02) continue;
    float s=(q.y-R.y)/R.w;
    if(s<-.14 || s>=1.) continue;
    s=max(s,0.);
    vec4 P=uTong[i];
    vec2 c=R.xz+P.yz*s*s+vec2(.05*s*sin(s*5.5-uT*5.5+P.w),0.);
    float halfW=P.x*pow(1.-s,.5)*min(1.,s*4.+.6);
    float v=1.-length(q.xz-c)/halfW;
    if(v>0.) total=1.-(1.-total)*(1.-pow(v,.7)*(1.-s*.28));
  }
  return total;
}

vec3 shadeWood(vec3 p, vec3 rd, int id){
  vec3 a=LA[id], b=LB[id];
  float r=LR[id], seed=LS[id];
  vec3 n=woodNormal(p);
  vec3 u=normalize(b-a);
  vec3 v1=normalize(vec3(0.,1.,0.)-u*u.y), v2=cross(u,v1);
  vec3 w=p-a;
  float along=dot(w,u);
  vec3 radial=w-u*along;
  float dv1=dot(radial,v1), dv2=dot(radial,v2);
  float around=atan(dv2,dv1);
  float cold=1.-smoothstep(.02,.4,uLevel);

  // Firelight: from low in the heart of the pile and from the flames above.
  vec3 toCore=vec3(.0,.42,.0)-p;
  float dCore=length(toCore);
  float heart=max(dot(n,toCore/dCore),0.)/(1.+dCore*dCore*1.6);
  vec3 toTop=vec3(.0,1.3,.35)-p;
  float dTop=length(toTop);
  float crown=max(dot(n,toTop/dTop),0.)/(1.+dTop*dTop*.7);
  float lit=uLevel*uFlick;
  float light=lit*(heart*2.1+crown*1.05)+uFlash*.22*max(n.y,0.);

  // Flame touching this bit of surface scorches and lights it.
  float lick=uLevel>0.?flameAt(p+n*.07):0.;
  float view=clamp(dot(n,-rd),0.,1.);
  float edge=smoothstep(.0,.42,view);
  float sky=max(dot(n,normalize(vec3(-.2,.86,.46))),0.);

  if(abs(dot(n,u))>.72){
    float radius=length(vec2(dv1,dv2))/r;
    float rings=.5+.5*sin(radius*26.+vn(vec2(radius*4.,seed))*4.);
    float split=smoothstep(.96,1.,1.-abs(fract(around*.7+seed)-.5)*2.);
    vec3 wood=mix(vec3(.5,.31,.16),vec3(.78,.57,.33),rings);
    wood=mix(wood,vec3(.08,.05,.03),smoothstep(.72,1.,radius));
    wood*=1.-split*.75;
    vec3 col=wood*(.07+light*1.5)*.9;
    col+=fireRamp(.45)*uEmbers*smoothstep(.86,1.,radius)*(.5+.5*vn(vec2(around*3.,uT*.7)));
    col+=fireRamp(.5+.3*lick)*lick*.55;
    return max(col,wood*.62*(.72+.28*(1.-radius))*cold);
  }

  float grain=fbm(vec2(along*4.6+seed,around*2.4));
  float ridge=1.-abs(2.*fbm(vec2(along*2.4+seed*3.,around*3.6))-1.);
  float burnt=smoothstep(.38,.66,fbm(vec2(along*1.5+seed*2.,around*1.1)));
  // Wood chars more the deeper into the fire it sits.
  float charred=clamp(burnt+uEmbers*(1.-smoothstep(.55,1.25,length(p.xz)))*.7,0.,1.);
  vec3 bark=mix(vec3(.13,.075,.04),vec3(.46,.28,.15),grain);
  bark=mix(bark,vec3(.035,.03,.03),charred);
  bark*=.5+.62*ridge;
  vec3 col=bark*(.05+light*2.1)*edge;
  col+=vec3(.5,.22,.07)*light*light*smoothstep(.45,.9,grain)*edge;

  // Where flame meets wood the surface glows, and the cracks there run hot.
  float crack=smoothstep(.9,.99,ridge)*(.3+.7*charred);
  float pulse=.5+.6*vn(vec2(along*2.6+seed,uT*.9));
  float hot=uEmbers*(.32+lick*1.4);
  col+=fireRamp(.34+.3*pulse+.25*lick)*crack*hot*1.5;
  col+=fireRamp(.3+.5*lick)*lick*lick*(.35+.45*grain)*uEmbers;

  // With no fire, a faint light from above: dark, but solid and clearly wood.
  vec3 coldBark=mix(vec3(.2,.13,.09),vec3(.66,.46,.32),smoothstep(.25,.75,grain));
  coldBark=mix(coldBark,vec3(.14,.13,.135),burnt*.75);
  coldBark*=.22+1.2*ridge*ridge;
  return max(col,coldBark*(.14+1.25*sky)*edge*cold);
}

// The bed of coals and ash under the logs.
vec3 shadeFloor(vec3 p, inout float cover){
  float lit=uLevel*uFlick;
  float d2=p.x*p.x*.42+p.z*p.z*.8;
  vec3 col=vec3(.012,.011,.012)+vec3(.2,.075,.018)*exp(-d2*1.6)*lit*.5;
  float rim=length(vec2(p.x/1.42,p.z/1.02))+(vn(p.xz*5.)-.5)*.2;
  float band=smoothstep(1.,.86,rim);
  if(band<=0.) return col;
  vec2 g=p.xz*vec2(15.,17.), id=floor(g), f=fract(g);
  float best=9., which=0.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 c=vec2(float(i),float(j));
    vec2 o2=vec2(h21(id+c),h21(id+c+9.));
    float dist=length(c+o2-f);
    if(dist<best){ best=dist; which=h21(id+c+31.); }
  }
  float lump=smoothstep(.62,.2,best)*band;
  if(lump<=.03) return col;
  cover=1.;
  // Hottest in the middle of the bed, and shadowed right up against the logs.
  float inner=1.-smoothstep(.15,.95,rim);
  float contact=.25+.75*smoothstep(.0,.2,woodDist(p));
  float heat=uEmbers*(.22+.75*vn(vec2(which*40.,uT*.55)))*(.4+.8*inner);
  vec3 hot=fireRamp(heat*.86)*(.5+.65*smoothstep(.55,.2,best));
  vec3 ash=vec3(.17,.16,.155)*(.4+.85*which);
  return (mix(ash,hot,smoothstep(.04,.34,uEmbers))+vec3(.3,.13,.04)*lit*inner*.35)*lump*contact;
}

void main(){
  vec2 px=gl_FragCoord.xy*uCellPx;
  vec2 uv=vec2(px.x-uRes.x*.5,px.y-uFloor)/uScale;

  // Off-axis camera, looking slightly down: uv is the point at z=0.
  vec3 ro=vec3(0.,${CAM_Y.toFixed(2)},${CAM_D.toFixed(2)});
  vec3 rd=normalize(vec3(uv,0.)-ro);

  vec3 inv=1./rd;
  vec3 t0=(BOXMIN-ro)*inv, t1=(BOXMAX-ro)*inv;
  vec3 tmin=min(t0,t1), tmax=max(t0,t1);
  float tIn=max(max(tmin.x,tmin.y),tmin.z), tOut=min(min(tmax.x,tmax.y),tmax.z);
  bool inBox=tOut>tIn;

  // One warp per ray keeps the flame edges crisp at character resolution.
  vec2 s1=uv*vec2(2.1,1.5)-vec2(0.,uT*1.75);
  vec2 warp=vec2(fbm(s1),fbm(s1+vec2(5.2,1.3)))-.5;

  // Find the first solid thing along the ray.
  float tHit=rd.y<0.?-ro.y/rd.y:1e9;
  bool floorHit=rd.y<0.;
  int hitId=-1;
  if(inBox){
    float t=tIn;
    for(int i=0;i<48 && t<min(tOut,tHit);i++){
      int id;
      float d=woodDist(ro+rd*t,id);
      if(d<.002){ tHit=t; hitId=id; floorHit=false; break; }
      t+=d;
    }
  }

  vec3 col=vec3(.012,.011,.012);
  float cover=0.;
  if(hitId>=0){ col=shadeWood(ro+rd*tHit,rd,hitId); cover=1.; }
  else if(floorHit) col=shadeFloor(ro+rd*tHit,cover);

  // Walk the ray through the fire, stopping at whatever solid thing it reaches,
  // so flames behind a log are hidden by it and flames in front pass over it.
  if(inBox && uLevel>0.){
    float acc=0., heightAt=0.;
    float end=min(tOut,tHit), stepLen=.052;
    for(float t=tIn+stepLen*.5;t<end;t+=stepLen){
      vec3 p=ro+rd*t;
      float ht=clamp(p.y/HMAX,0.,1.4);
      vec3 q=p+vec3(warp.x*(.14+ht*.62)-uWind*ht*ht*.5,warp.y*.2,warp.x*(.1+ht*.3));
      float f=flameAt(q);
      // The heart of the fire, down among the logs.
      vec3 c=(p-vec3(.0,.24,.0))/vec3(.72,.17,.42);
      f=max(f,exp(-dot(c,c))*min(1.,uLevel*1.8)*(.6+.4*warp.y));
      if(f>0.){ acc+=f; heightAt=max(heightAt,ht); }
    }
    acc*=stepLen/.3;
    if(acc>.01){
      float streak=fbm(vec2(uv.x*11.,uv.y*3.-uT*3.4));
      float tear=smoothstep(.2,.75,fbm(vec2(uv.x*5.,uv.y*2.2-uT*2.5)));
      float vein=fbm(vec2(uv.x*7.,uv.y*2.2-uT*2.6)+11.);
      float body=(1.-exp(-acc*2.25))*mix(.74,1.12,streak)*mix(.78,1.04,tear);
      float T=body*(1.-.28*clamp(heightAt,0.,1.));
      vec3 fc=fireRamp(T*mix(.82,1.08,vein));
      float a=smoothstep(.05,.36,body);
      col=mix(col,fc,a)+fc*a*.25;
      if(body>.05) cover=1.;
    }
  }

  float luma=dot(col,vec3(.3,.55,.15));
  float density=cover>0.?clamp(pow(luma,.52),.04,1.):0.;
  float dither=(h21(gl_FragCoord.xy)-.5)/255.;
  o=vec4(col+dither,density);
}`;

// Pass 2: full resolution. Characters, sparks and bloom.
const DRAW = `#version 300 es
precision highp float;
uniform sampler2D uSim, uOverlay, uAtlas;
uniform int uCW, uCH, uH, uGap, uRamp;
uniform vec2 uRes;
uniform float uT, uGlow;
out vec4 o;
float h(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }

void main(){
  ivec2 raw=ivec2(gl_FragCoord.xy);
  ivec2 px=ivec2(raw.x,uH-1-raw.y);
  ivec2 c=ivec2(px.x/uCW,px.y/uCH), s=px-c*ivec2(uCW,uCH);
  ivec2 sz=textureSize(uSim,0);
  ivec2 simC=ivec2(c.x,sz.y-1-c.y);
  vec4 d=texelFetch(uSim,simC,0);
  vec4 ov=texelFetch(uOverlay,c,0);
  bool inside=s.x<uCW-uGap && s.y<uCH-uGap;
  vec3 col;
  int oa=int(ov.a*255.+.5);
  if(oa!=0){
    int g=oa&63;
    float ink=g>0?texelFetch(uAtlas,ivec2(g*uCW+s.x,s.y),0).r:0.;
    col=mix(d.rgb*.7,ov.rgb,ink);
  } else if(d.a>0.){
    float seed=h(vec2(c)+3.);
    float tick=floor(uT*7.+seed*7.);
    float jitter=(h(vec2(c)+tick*.37)-.5)*.07;
    int g=clamp(int(pow(clamp(d.a+jitter,0.,1.),.9)*float(uRamp-1))+1,1,uRamp-1);
    float ink=texelFetch(uAtlas,ivec2(g*uCW+s.x,s.y),0).r;
    col=inside?mix(d.rgb*.56,min(vec3(1.),d.rgb*1.18+.1),ink):d.rgb*.26;
  } else {
    col=d.rgb;
  }
  // Light spilling off the fire, from two blurred copies of the image.
  vec2 uv=gl_FragCoord.xy/uRes;
  vec3 b1=textureLod(uSim,uv,2.5).rgb, b2=textureLod(uSim,uv,4.5).rgb;
  col+=(b1*vec3(.28,.19,.13)+b2*vec3(.3,.17,.08))*uGlow;
  o=vec4(col,1.);
}`;

// ---- GL setup --------------------------------------------------------------
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", {
  alpha: false, antialias: false, depth: false, stencil: false, powerPreference: "low-power",
});
if (!gl) throw new Error("WebGL2 unavailable");

function program(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name.replace("[0]", "")] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const sim = program(SIM), draw = program(DRAW);
gl.bindVertexArray(gl.createVertexArray());

const simTex = gl.createTexture(), overlayTex = gl.createTexture(), atlasTex = gl.createTexture();
const fbo = gl.createFramebuffer();
function setup(tex, minFilter, magFilter) {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, magFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
setup(simTex, gl.LINEAR_MIPMAP_LINEAR, gl.LINEAR);
setup(overlayTex, gl.NEAREST, gl.NEAREST);
setup(atlasTex, gl.NEAREST, gl.NEAREST);

let W = 0, H = 0, cw = 0, ch = 0, cols = 0, rows = 0, overlay = new Uint8Array(4);
let xC = 0, yFloor = 0, fw = 0, fwRows = 0;

function buildAtlas() {
  const cv = document.createElement("canvas");
  cv.width = cw * GLYPHS.length; cv.height = ch;
  const g = cv.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = "#fff";
  g.font = `700 ${Math.round(ch * .95)}px Menlo, "DejaVu Sans Mono", ui-monospace, monospace`;
  g.textAlign = "center"; g.textBaseline = "middle";
  for (let i = 0; i < GLYPHS.length; i++) g.fillText(GLYPHS[i], cw * (i + .5), ch * .54);
  gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  const ncw = Math.max(3, Math.round(CFG.cellW * dpr)), nch = Math.max(5, Math.round(CFG.cellH * dpr));
  if (w === W && h === H && ncw === cw && nch === ch) return;
  W = canvas.width = w; H = canvas.height = h; cw = ncw; ch = nch;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  overlay = new Uint8Array(cols * rows * 4);
  xC = cols >> 1;
  yFloor = Math.round(rows * (1 - CFG.floorY));
  fw = W * CFG.fireWidth / cw;
  fwRows = W * CFG.fireWidth / ch;

  gl.bindTexture(gl.TEXTURE_2D, simTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, simTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  gl.bindTexture(gl.TEXTURE_2D, overlayTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, overlay);
  buildAtlas();
}
addEventListener("resize", resize);

// ---- simulation ------------------------------------------------------------
// out -> (enough clicks) -> growing -> burning -> fading -> out
let T = 0, flick = 1, wind = 0, windGoal = 0;
let phase = "out", phaseAge = 0, level = 0, embers = 0, charge = 0, flash = 0;
let burnLeft = 0, surge = 0, press = null;
const sparks = [];
const flies = [], mouse = { x: -1, y: -1 };   // mouse in screen heights from the top-left
let fliesOn = true;
const cursor = { x: -1 };
const noise1 = x => {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return hash(i, 11) * (1 - u) + hash(i + 1, 11) * u;
};

// Every flame is rooted at a point on a log's upper surface.
const logWeights = LOGS.map(l => Math.hypot(l.b[0] - l.a[0], l.b[1] - l.a[1], l.b[2] - l.a[2]));
const logTotal = logWeights.reduce((a, b) => a + b, 0);
function pointOnWood() {
  let pick = Math.random() * logTotal, i = 0;
  while (i < LOGS.length - 1 && (pick -= logWeights[i]) > 0) i++;
  const l = LOGS[i], t = rand(.06, .94);
  const c = [0, 1, 2].map(k => l.a[k] + (l.b[k] - l.a[k]) * t);
  const axis = [0, 1, 2].map(k => (l.b[k] - l.a[k]) / logWeights[i]);
  const up = [-axis[0] * axis[1], 1 - axis[1] * axis[1], -axis[2] * axis[1]];
  const un = Math.hypot(...up);
  const v1 = up.map(v => v / un);
  const v2 = [axis[1] * v1[2] - axis[2] * v1[1], axis[2] * v1[0] - axis[0] * v1[2], axis[0] * v1[1] - axis[1] * v1[0]];
  const phi = rand(-1.15, 1.15);
  const dir = [0, 1, 2].map(k => v1[k] * Math.cos(phi) + v2[k] * Math.sin(phi));
  const point = [0, 1, 2].map(k => c[k] + dir[k] * l.r);
  point.facing = dir[2];   // how much this spot faces the viewer
  return point;
}

function respawn(t) {
  const reach = .3 + .75 * level;
  let p = pointOnWood();
  for (let tries = 0; tries < 14 && (Math.abs(p[0]) > reach || Math.random() < Math.abs(p[0]) * .55); tries++) p = pointOnWood();
  t.root = p;
  t.life = rand(1.1, 2.35);
  t.age = t.started ? 0 : rand(0, t.life);
  t.started = true;
  t.size = rand(.42, 1);
  t.wide = rand(.09, .21);
  t.short = 1 - .62 * Math.max(0, p.facing) - .3 * Math.max(0, p[2]);   // flames in front stay low, so the wood shows
  t.leanX = -p[0] * rand(.05, .3) + rand(-.1, .1);
  t.leanZ = -p[2] * rand(.05, .28);
  t.phase = rand(0, 6.28);
}
const tongues = Array.from({ length: MAX_TONGUES }, () => { const t = {}; respawn(t); return t; });
const rootData = new Float32Array(MAX_TONGUES * 4), tongData = new Float32Array(MAX_TONGUES * 4);

function stepTongues(dt) {
  const active = Math.ceil(MAX_TONGUES * Math.min(1, level * 1.7));
  const grow = .16 + .84 * Math.pow(level, .8);
  tongues.forEach((t, i) => {
    if ((t.age += dt) >= t.life) respawn(t);
    const u = t.age / t.life;
    const h = i < active && level > 0
      ? 2.4 * t.size * t.short * (1 - .6 * Math.pow(Math.abs(t.root[0]), 1.5)) * Math.pow(Math.sin(Math.PI * u), .6) * grow
      : 0;
    rootData.set([t.root[0], t.root[1], t.root[2], h], i * 4);
    tongData.set([t.wide, t.leanX + wind * -.25, t.leanZ, t.phase], i * 4);
  });
}

function emitSpark(x, y, fast) {
  if (sparks.length > 240) sparks.shift();
  sparks.push({ x, y, px: x, py: y, vx: rand(-6, 6), vy: -rand(fast ? 22 : 14, fast ? 48 : 32), age: 0, life: rand(.7, 2.3), seed: rand(0, 90) });
}

function sparkBurst(n) {
  for (let i = 0; i < n; i++) {
    const p = pointOnWood();
    emitSpark(xC + p[0] * fw, yFloor - p[1] * fwRows, true);
  }
}

function strike(x, y) {
  charge += 1;
  flash = 1;
  press = { x, y, age: 0 };
  sparkBurst(18);
  if (charge < CFG.strikes) return;
  if (phase === "out" || phase === "fading") {
    phase = "growing"; phaseAge = 0; charge = 0;
  } else if (phase === "burning") {
    // Feeding a burning fire buys more time, and it flares up to say so.
    burnLeft += CFG.extend; surge = 6; charge = 0;
    sparkBurst(40);
  }
}

// How far the fire has got. It runs on real time, so it keeps burning down
// while the wallpaper is hidden behind windows.
function lifecycle(dt) {
  charge = Math.max(0, charge - dt * .35);

  // A press held still starts the fade, which runs fast for as long as it's held.
  if (press && (press.age += dt) >= CFG.hold && !press.held) {
    press.held = true;
    if (phase === "growing" || phase === "burning") {
      phase = "fading"; phaseAge = 0; charge = 0; surge = 0;
      sparkBurst(30);
    }
  }

  phaseAge += dt;
  if (phase === "growing") {
    // Slow to catch, then builds.
    level = Math.min(1, level + dt * (.33 + 1.95 * level) / CFG.grow);
    if (level >= 1) { phase = "burning"; phaseAge = 0; burnLeft = CFG.burn; charge = 0; }
  } else if (phase === "burning") {
    burnLeft -= dt;
    surge = Math.max(0, surge - dt);
    const wander = clamp((noise1(T * .07) * .6 + noise1(T * .19 + 9) * .4 - .2) / .6, 0, 1);
    const goal = surge > 0 ? 1 : CFG.burnLow + (1 - CFG.burnLow) * wander;
    level += (goal - level) * Math.min(1, dt / (surge > 0 ? 1.2 : 4));
    if (burnLeft <= 0) { phase = "fading"; phaseAge = 0; }
  } else if (phase === "fading") {
    const snuffing = press && press.held ? 1 / CFG.snuff : 0;
    level = Math.max(0, level - dt * ((.6 + .8 * level) / CFG.fade + snuffing));
    if (level <= 0) { phase = "out"; phaseAge = 0; }
  }
  // Coals outlast the flames.
  embers += ((level > 0 ? Math.min(1, level * 2.5) : 0) - embers) * Math.min(1, dt / (level > 0 ? 3 : 26));
}

function advanceClock(seconds) {
  while (seconds > 0 && !(phase === "out" && embers < .001)) {
    const slice = Math.min(seconds, .25);
    lifecycle(slice);
    seconds -= slice;
  }
}

let wall = 0;
function clockSince(now) {
  const gap = wall ? (now - wall) / 1000 : 1 / CFG.fps;
  wall = now;
  if (gap > .5) press = null;   // the wallpaper was hidden; any press is long over
  return Math.max(0, gap);
}

function step(dt, clockDt = dt) {
  T += dt;
  windGoal *= Math.exp(-dt * 1.5);
  wind += (windGoal - wind) * Math.min(1, dt * 3);
  flick = .84 + .3 * noise1(T * 3.1) + .12 * noise1(T * 9 + 40);
  flash *= Math.exp(-dt * 5);
  advanceClock(clockDt);

  stepTongues(dt);
  if (fliesOn) stepFlies(dt);

  if (Math.random() < level * 17 * dt) {
    const p = pointOnWood();
    emitSpark(xC + p[0] * fw, yFloor - (p[1] + rand(0, .7 * level)) * fwRows, false);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    if ((s.age += dt) > s.life) { sparks.splice(i, 1); continue; }
    s.px = s.x; s.py = s.y;
    s.vx += (noise1(s.seed + T * 2.4) - .5) * 60 * dt + wind * 6 * dt;
    s.vy += 6 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
  }
}

// ---- rendering -----------------------------------------------------------------
function putOverlay(x, y, c, glyph) {
  if (x < 0 || y < 0 || x >= cols || y >= rows) return;
  const i = (y * cols + x) * 4;
  overlay[i] = Math.min(255, c[0] * 255);
  overlay[i + 1] = Math.min(255, c[1] * 255);
  overlay[i + 2] = Math.min(255, c[2] * 255);
  overlay[i + 3] = glyph;
}

// Where fireflies may fly, in screen heights from the top-left: inside the frame, below
// the menu bar, and outside a shape round the logs that narrows up to the flame tips.
function flyBounds() {
  const aspect = W / H, u = aspect * CFG.fireWidth, floor = 1 - CFG.floorY;
  return { minX: .02, maxX: aspect - .02, minY: .05, maxY: .975, cx: aspect / 2, top: floor - 3 * u, neck: floor - .55 * u, bottom: Math.min(.955, floor + .62 * u), wide: 1.6 * u + .02, tip: .55 * u + .02 };
}
function fireHalfWidth(b, y) { return y >= b.neck ? b.wide : b.tip + (b.wide - b.tip) * (y - b.top) / (b.neck - b.top); }
function inFire(b, x, y) { return y > b.top && y < b.bottom && Math.abs(x - b.cx) < fireHalfWidth(b, y); }
function outOfFrame(b, x, y) { return x < b.minX || x > b.maxX || y < b.minY || y > b.maxY; }

function stepFlies(dt) {
  const b = flyBounds();
  for (const f of flies) {
    let ax = (noise1(f.seed + T * .35) - .5) * .35, ay = (noise1(f.seed + 70 + T * .35) - .5) * .35;
    // Turn back before reaching the edges or the fire.
    if (f.x < b.minX + .05) ax += (b.minX + .05 - f.x) * 4;
    if (f.x > b.maxX - .05) ax -= (f.x - b.maxX + .05) * 4;
    if (f.y < b.minY + .05) ay += (b.minY + .05 - f.y) * 4;
    if (f.y > b.maxY - .05) ay -= (f.y - b.maxY + .05) * 4;
    if (inFire(b, f.x, f.y - .06) || inFire(b, f.x - .06, f.y) || inFire(b, f.x + .06, f.y)) {
      ax += Math.sign(f.x - b.cx || 1) * .5; ay -= .15;
    }
    f.fright *= Math.exp(-dt * 1.6);
    if (mouse.x >= 0) {
      const mx = f.x - mouse.x, my = f.y - mouse.y, d = Math.hypot(mx, my) || 1e-3;
      if (d < CFG.flyAvoid) {
        const k = 1 - d / CFG.flyAvoid;
        let ux = mx / d, uy = my / d;
        // Pinned against an edge: run along it instead of pushing into it.
        const wallX = (f.x <= b.minX + .03 && ux < 0) || (f.x >= b.maxX - .03 && ux > 0);
        const wallY = (f.y <= b.minY + .03 && uy < 0) || (f.y >= b.maxY - .03 && uy > 0);
        if (wallX && wallY) { ux = Math.sign(b.cx - f.x || 1); uy = 0; }
        else if (wallX) { ux = 0; uy = Math.sign(uy || f.seed - 450); }
        else if (wallY) { uy = 0; ux = Math.sign(ux || f.seed - 450); }
        ax += ux * k * k * 9; ay += uy * k * k * 9;
        f.fright = Math.max(f.fright, k);
      }
    }
    const damp = Math.exp(-dt * .9);
    f.vx = (f.vx + ax * dt) * damp; f.vy = (f.vy + ay * dt) * damp;
    const limit = CFG.flyDrift + f.fright * CFG.flyFlee, speed = Math.hypot(f.vx, f.vy);
    if (speed > limit) { f.vx *= limit / speed; f.vy *= limit / speed; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    // Nothing above can carry one past these limits.
    if (inFire(b, f.x, f.y)) {
      const side = fireHalfWidth(b, f.y) - Math.abs(f.x - b.cx), up = f.y - b.top, down = b.bottom - f.y;
      if (side <= up && side <= down) { f.x = b.cx + Math.sign(f.x - b.cx || 1) * fireHalfWidth(b, f.y); f.vx = 0; }
      else if (up <= down) { f.y = b.top; f.vy = 0; }
      else { f.y = b.bottom; f.vy = 0; }
    }
    if (f.x < b.minX) { f.x = b.minX; f.vx = 0; } else if (f.x > b.maxX) { f.x = b.maxX; f.vx = 0; }
    if (f.y < b.minY) { f.y = b.minY; f.vy = 0; } else if (f.y > b.maxY) { f.y = b.maxY; f.vy = 0; }
  }
}

function drawFlies() {
  for (const f of flies) {
    // Each one glows and fades on its own rhythm, and flares when startled.
    const pulse = Math.max(0, Math.sin(T * f.rate + f.seed)) ** 2;
    const b = clamp(.22 + .78 * pulse + f.fright, 0, 1);
    const core = [.55, 1, .32].map(v => v * b);
    const x = Math.floor(f.x * H / cw), y = Math.floor(f.y * H / ch);
    putOverlay(x, y, core, G[f.small ? "\u2022" : "\u25CF"]);
  }
}

function sparkColour(u) {
  const t = 1 - u;
  return [1, .35 + .55 * t, .05 + .45 * t * t];
}

function render() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, cols, rows);
  gl.useProgram(sim.p);
  gl.uniform2f(sim.u.uRes, W, H);
  gl.uniform2f(sim.u.uCellPx, cw, ch);
  gl.uniform1f(sim.u.uScale, W * CFG.fireWidth);
  gl.uniform1f(sim.u.uFloor, H * CFG.floorY);
  gl.uniform1f(sim.u.uT, T);
  gl.uniform1f(sim.u.uLevel, level);
  gl.uniform1f(sim.u.uEmbers, embers);
  gl.uniform1f(sim.u.uFlick, flick);
  gl.uniform1f(sim.u.uFlash, flash);
  gl.uniform1f(sim.u.uWind, wind);
  gl.uniform4fv(sim.u.uRoot, rootData);
  gl.uniform4fv(sim.u.uTong, tongData);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, simTex);
  gl.generateMipmap(gl.TEXTURE_2D);

  overlay.fill(0);
  if (fliesOn) drawFlies();
  for (const s of sparks) {
    const u = s.age / s.life, c = sparkColour(u);
    putOverlay(Math.floor(s.px), Math.floor(s.py), [c[0] * .5, c[1] * .5, c[2] * .5], G["."]);
    putOverlay(Math.floor(s.x), Math.floor(s.y), c, G[u < .4 ? "*" : (u < .75 ? "'" : ".")]);
  }
  gl.bindTexture(gl.TEXTURE_2D, overlayTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, overlay);

  gl.viewport(0, 0, W, H);
  gl.useProgram(draw.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, simTex); gl.uniform1i(draw.u.uSim, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, overlayTex); gl.uniform1i(draw.u.uOverlay, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, atlasTex); gl.uniform1i(draw.u.uAtlas, 2);
  gl.uniform1i(draw.u.uCW, cw);
  gl.uniform1i(draw.u.uCH, ch);
  gl.uniform1i(draw.u.uH, H);
  gl.uniform1i(draw.u.uGap, Math.max(1, Math.round((window.devicePixelRatio || 1) * .5)));
  gl.uniform1i(draw.u.uRamp, RAMP.length);
  gl.uniform2f(draw.u.uRes, W, H);
  gl.uniform1f(draw.u.uT, T);
  gl.uniform1f(draw.u.uGlow, clamp(level * 2.5 + embers * .8 + flash * .6, 0, 1));   // no haze over cold logs
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}

resize();
for (let i = 0; i < CFG.fireflies; i++) {
  flies.push({ x: rand(0, W / H), y: rand(.1, .85), vx: 0, vy: 0, seed: rand(0, 900), rate: rand(.9, 1.7), fright: 0, small: i % 5 > 2 });
}

// ---- host API (same shape as the other scenes) -----------------------------
let paused = false;
const ascii = window.ascii = {
  pointer(x, y) {
    // A moving cursor is a drag, not a hold.
    if (press && Math.hypot(x - press.x, y - press.y) > .006) press = null;
    const nx = x * cols;
    if (cursor.x >= 0) windGoal = clamp(windGoal + (nx - cursor.x) * .018, -2.2, 2.2);
    cursor.x = nx;
    mouse.x = x * W / H; mouse.y = y;
  },
  click: strike,
  release() { press = null; },
  scroll() {},
  setPaused(p) { paused = p; if (!p) { last = 0; wall = 0; requestAnimationFrame(loop); } },
  // For testing: advance instantly, and render one frame to a PNG.
  warp(seconds) { for (let i = 0; i < seconds * 30; i++) step(1 / 30); },
  state: () => ({ phase, level: +level.toFixed(3), embers: +embers.toFixed(3), charge: +charge.toFixed(2), burnLeft: Math.round(burnLeft), flyNearest: flies.reduce((n, f) => Math.min(n, Math.hypot(f.x - mouse.x, f.y - mouse.y)), 9), flyInFire: flies.filter(f => inFire(flyBounds(), f.x, f.y)).length, flyOutside: flies.filter(f => outOfFrame(flyBounds(), f.x, f.y)).length }),
  frame() { render(); return canvas.toDataURL("image/png"); },
  // The lock screen picture: a fully burning fire, always the same one. Whatever
  // the live fire is doing is put back afterwards, so this can't light it.
  still() {
    const keep = { phase, phaseAge, level, embers, charge, flash, burnLeft, surge, press, T, flick, wind, windGoal };
    const random = Math.random;
    let seed = CFG.stillSeed;
    Math.random = () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    fliesOn = false;   // the lock screen stays the same picture every time
    phase = "burning"; level = 1; embers = 1; burnLeft = 1e9;
    surge = 0; flash = 0; press = null; wind = windGoal = 0; T = 40;
    sparks.length = 0;
    tongues.forEach(t => { t.started = false; respawn(t); });
    for (let i = 0; i < 150; i++) step(1 / 30);
    render();
    const png = canvas.toDataURL("image/png");
    Math.random = random;
    fliesOn = true;
    ({ phase, phaseAge, level, embers, charge, flash, burnLeft, surge, press, T, flick, wind, windGoal } = keep);
    sparks.length = 0;
    stepTongues(0);
    render();
    return png;
  },
};

addEventListener("pointermove", e => ascii.pointer(e.clientX / innerWidth, e.clientY / innerHeight));
addEventListener("pointerdown", e => ascii.click(e.clientX / innerWidth, e.clientY / innerHeight));
addEventListener("pointerup", () => ascii.release());

let last = 0;
function loop(ts) {
  if (paused) return;
  requestAnimationFrame(loop);
  if (last && ts - last < 1000 / CFG.fps - 2) return;
  last = ts;
  ascii.frames = (ascii.frames || 0) + 1;
  step(1 / CFG.fps, clockSince(Date.now()));
  render();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
